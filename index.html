/* Layout: one-screen consult room — header, scrolling transcript, composer pinned to the bottom */

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;margin:0}
.app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{padding-block:14px 10px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}

<script>
const CASES = {"A":{"head":"A. Exertional chest pain. M = Michael Clark, 62, accountant. F = Margaret Clark, 66, retired teacher.","open":"Opening line: \"I get a pressure in my chest when I climb stairs.\"","brief":"Story in brief: 3 weeks of chest pressure when climbing stairs, goes away with rest.","hpi":"HPI: 3 weeks; first on train-station stairs; center of chest, heavy pressure, spreads to left arm (F: also jaw); 6/10; about 5 min, goes away with rest; 2-3 times a week, only with exertion (stairs, walking fast, carrying bags). During episodes: short of breath and sweaty. Denies: pain at rest, palpitations, fainting, cough, fever, leg swelling. Took nothing; no doctor yet. Ideas: \"my heart?\" Concern: father died of a heart attack at 68. Expectation: wants to know if the heart is OK.","hx":"PMH: high blood pressure 10 yr, high cholesterol 5 yr; never hospitalized. PSH: M hernia repair 2010; F hysterectomy 2005 for fibroids. Meds: amlodipine 5 mg once a day, atorvastatin 10 mg once a day; fish-oil capsules (only if asked about supplements). Allergies: M none; F says \"allergic to codeine\" but it only upset her stomach (side effect). F: menopause at 52.","fhsh":"FH: father heart attack, died at 68; mother 85, high blood pressure and diabetes; one brother 60, healthy. SH: lives with spouse and son; ex-smoker, quit 5 yr ago (M 20 cigarettes/day for 30 yr; F 10/day for 40 yr); M 2 beers/day, F 1 glass of wine/day; no drugs; little exercise.","ros":"ROS: only positive = occasional heartburn after big meals (only if asked). All else negative.","pe":"PE: BP 148/88, HR 76, RR 14, T 36.6, SpO2 98%; heart and lungs normal; no leg edema.","tests":"Reasonable tests: ECG, troponin, cholesterol, exercise stress test, echocardiogram.","names":{"M":"Michael Clark","F":"Margaret Clark"}},"B":{"head":"B. Wheezing. M = Robert Wilson, 45, office manager. F = Rachel Wilson, 28, graduate student.","open":"Opening line: \"I've been coughing and wheezing for three days.\"","brief":"Story in brief: 3 days of cough, wheezing and chest tightness after a cold; known asthma.","hpi":"HPI: 3 days, began after a cold last week; wheezing, chest tightness, short of breath, cough with a little clear phlegm; worse at night and early morning (woke up 2 nights); cold air and stairs make it worse; albuterol inhaler helps about 2 hours, now using it 3-4 times a day (usually a few times a month); tightness 6/10; can speak in full sentences. Denies: fever now, chest pain, coughing blood, leg swelling. Ideas: \"my asthma is acting up.\" Concern: was hospitalized once at 15. Expectation: stronger medicine.","hx":"PMH: asthma since childhood (one hospitalization at 15), hay fever. PSH: M appendectomy 2005; F none. Meds: albuterol inhaler as needed; stopped a daily steroid inhaler a year ago; loratadine OTC for hay fever (only if asked about OTC medicines); F also birth-control pill (only if asked about other medicines). Allergies: aspirin makes breathing worse; cats cause wheezing. F: last period 2 weeks ago, not pregnant.","fhsh":"FH: mother asthma; father high blood pressure. SH: M lives with wife and 2 kids; family got a cat 2 weeks ago (only if asked about pets, home or triggers). F lives with a roommate who smokes on the balcony (only if asked about smoke). Never smoker; 1-2 drinks on weekends; no drugs.","ros":"ROS: only positive = poor sleep (only if asked). All else negative.","pe":"PE: RR 22, HR 98, SpO2 95%, T 36.8; diffuse expiratory wheezes; no edema.","tests":"Reasonable tests: peak flow, spirometry, oxygen saturation, chest X-ray.","names":{"M":"Robert Wilson","F":"Rachel Wilson"}},"C":{"head":"C. Headache. F = Emily Brown, 32, graphic designer. M = Daniel Brown, 30, software engineer.","open":"Opening line: \"I've had a really bad headache since yesterday.\"","brief":"Story in brief: right-sided throbbing headache since yesterday; similar headaches since college.","hpi":"HPI: began yesterday about 3 pm at the computer; built up over an hour; right temple; throbbing; 8/10 at worst, now 6; light, noise and moving make it worse; lying in a dark room helps a little; constant since then. Similar headaches 1-2 times a month since college, usually about a day; this one is longer. Before it: zigzag flashing lights for about 20 min (only if asked about vision or warning signs). Nausea, vomited once. Denies: fever, stiff neck, weakness, numbness, trouble speaking, head injury, \"worst headache of my life\". Took ibuprofen 400 mg, little help. Ideas: \"my usual headache, but worse.\" Concern: brain tumor. Expectation: better medicine.","hx":"PMH: none. PSH: F none; M knee arthroscopy 2015. Meds: ibuprofen as needed; F birth-control pill (only if asked about other medicines). Allergies: F sulfa drug gave a rash; M none. F: period started 2 days ago.","fhsh":"FH: mother migraines; father high blood pressure. SH: lives alone; long computer hours, deadline stress, poor sleep this week; never smoker; wine socially; 3 coffees a day; no drugs.","ros":"ROS: all negative.","pe":"PE: BP 122/78, HR 72, T 36.7; normal neurologic exam; no neck stiffness.","tests":"Reasonable answer: mainly a clinical diagnosis; headache diary; imaging only if warning signs.","names":{"M":"Daniel Brown","F":"Emily Brown"}},"D":{"head":"D. Right upper abdominal pain. F = Linda Johnson, 45, bank clerk. M = Thomas Johnson, 52, restaurant manager.","open":"Opening line: \"I have terrible pain up here on the right side of my stomach.\"","brief":"Story in brief: constant right upper belly pain since last night after a fatty meal, vomiting and feeling feverish.","hpi":"HPI: since last night, about an hour after fried chicken and fries; built up over 30 min; under the right ribs, sometimes to the right shoulder blade; constant deep ache, sometimes sharper; 7/10; deep breath makes it worse; nothing helps; acetaminophen did not help. Several shorter episodes (1-2 hours) after big meals in the last 3 months. Nausea, vomited twice; felt hot and shivery this morning. Denies: yellow skin or eyes, dark urine, pale stools, diarrhea, burning urine. Ideas: F \"gallstones like my mother\"; M \"food poisoning?\" Concern: needing surgery. Expectation: wants the pain to stop.","hx":"PMH: high blood pressure. PSH: F C-section 2010; M none. Meds: amlodipine 5 mg once a day; acetaminophen OTC last night; M also OTC omeprazole sometimes for heartburn (only if asked). Allergies: F penicillin gave hives; M none. F: last period 2 weeks ago, not pregnant.","fhsh":"FH: mother had gallstones, gallbladder removed, now well; father heart attack at 70, alive. SH: lives with spouse and 2 kids; F never smoker; M ex-smoker (10/day for 20 yr, quit 10 yr ago); wine or beer on weekends; no drugs.","ros":"ROS: all negative.","pe":"PE: T 38.2, HR 102, BP 138/86, SpO2 98%; right upper quadrant tenderness, positive Murphy's sign; no jaundice.","tests":"Reasonable tests: abdominal ultrasound, blood count, liver tests, lipase, CRP.","names":{"M":"Thomas Johnson","F":"Linda Johnson"}},"E":{"head":"E. Burning urination. F = Lisa Taylor, 28, sales assistant. M = George Taylor, 68, retired engineer.","open":"Opening line: \"It burns when I pee.\"","brief":"Story in brief: burning when urinating with frequent, urgent urination for 1-2 days.","hpi":"HPI: F since yesterday evening; M 2 days. Burning when urinating; peeing every 30-60 min, urgent, small amounts; mild lower-belly ache 3/10; cloudy urine; pink urine once. Drinking lots of water (F: cranberry juice). F: similar once 2 yr ago, antibiotics helped. M: weak stream for years, now up 3 times a night. Denies: fever, chills, back or side pain, nausea, vomiting; F: vaginal discharge or itching. Ideas: \"bladder infection.\" Concern: spreading to the kidneys. Expectation: antibiotics.","hx":"PMH: F none; M enlarged prostate, type 2 diabetes. PSH: F none; M cataract surgery 2020. Meds: F birth-control pill (only if asked); M tamsulosin 0.4 mg once a day, metformin 500 mg twice a day, saw palmetto supplement (only if asked about supplements). Allergies: F sulfa drug gave hives; M none. F: last period 2 weeks ago.","fhsh":"FH: F mother diabetes; M father prostate cancer. SH: F lives with partner; M lives with wife. F never smoker; M ex-smoker (20/day for 20 yr, quit 30 yr ago). F social drinking; M 1 beer/day; no drugs. F: sexually active with one male partner, new partner since last month (only after a polite, normalized question).","ros":"ROS: all negative.","pe":"PE: T 36.9, HR 80, BP F 118/72, M 136/80; suprapubic tenderness; no CVA tenderness.","tests":"Reasonable tests: urinalysis, urine culture; F urine pregnancy test; M also kidney function.","names":{"M":"George Taylor","F":"Lisa Taylor"}}};

const PATIENT_RULES = `HOW TO PLAY THE PATIENT
- Speak natural, simple American English, 1-3 short sentences per turn. Your words are read aloud: no lists, markdown, emojis, stage directions or name labels.
- Use everyday words only. Never use medical jargon or name a diagnosis (you may name conditions you already have, e.g. "high blood pressure").
- Answer only what is asked. To an open question ("Tell me more") give 1-2 more details, not everything. Items marked "only if asked" are revealed only to a specific question.
- Stay consistent with the case. If asked about something not in the case, give a brief ordinary answer that fits; never invent new important symptoms or diseases. Invent a date of birth that fits your age if asked.
- If the student uses a medical term, ask what it means.
- Show realistic feelings (worry, discomfort) and respond warmly to empathy.
- If the student writes in Japanese, say "Sorry, I don't speak Japanese. Could you say that in English?"
- If the conversation drifts off topic, answer briefly and steer back to your problem.
- Do not praise, correct or teach the student. Stay in role.

KEEPING THE CONVERSATION GOING (the student is a non-native speaker)
- If the student's English is broken, ungrammatical or incomplete, work out the most likely meaning and answer that naturally, as a kind patient would. Never comment on grammar or pronunciation.
- If you truly cannot tell what was meant, do not stay silent: ask one short, simple question that offers your best guess ("Sorry, do you mean when the pain started?").
- If the student hesitates, trails off, says only "um", "uh", "sorry" or "I don't know", or seems stuck, keep the conversation moving as a real patient would: add one small detail about how you feel, mention your worry, or ask "Is there anything else you'd like to know, doctor?" Do not volunteer answers to questions that have not been asked.
- If a note says the student has been silent for a while, gently re-engage in one short sentence ("Doctor? Is there anything else you'd like to ask me?" or "Should I tell you more about how it feels?").
- Always reply with something; never give an empty answer.`;

const FB_STYLE = `Write in Japanese; English only for example expressions. Be concise and encouraging. Plain text only: no Markdown symbols (#, *, |), no tables. Use exactly these headings on their own lines: 【できたこと】 【抜けていたこと・改善点】 【より自然な英語表現】. Under the last heading, quote 2-4 of the student's actual lines and give a more natural version. Do not grade whether any diagnosis is correct.`;

const MODES = {
  main:{label:'総合練習', title:'AI模擬患者（総合練習）', fields:ALL,
    scene:'This is a complete medical interview: chief complaint, HPI, past medical and surgical history, medications, allergies, family and social history, review of systems, and closing.',

    endLabel:'面接を終える', diagnosis:true,
    task:{ask:'H&P を英語で入力してください（目安15分）。PE と Labs は “Not performed” と書いてください。', timer:15, check:`Evaluate in Japanese with ○ / △ / × and a one-line comment for each item.

H&P: all components in the correct order; CC in the patient's words with duration; HPI in chronological sentences; pertinent positives and negatives; medications with dose and frequency; allergies with reaction (or NKDA); FH with ages and conditions, SH with pack-years; correct medical terms; A/P with summary, problem list and plan.

    feedback:`Cover briefly: (1) opening (introduction, identity check, permission); (2) which OPQRST elements, associated symptoms and ICE were asked or missed; (3) which of PMH, PSH, medications (including OTC), allergies (with reaction), family history, social history and ROS were missed; (4) closing; then (5) the better English expressions. At the very end add a line 【この症例】 stating the intended diagnosis and reasonable tests.`},
  s1:{label:'Session 1', title:'Session 1　面接の開始と主訴', fields:['open','brief'],

const $ = id => document.getElementById(id);
const log = $('log'), box = $('box');
let speaking = false, autoOn = true, autoTimer = 0, lastVal = '';
const AUTO_MS = 2200;
let sample = null, mode = null, M = null, kase = null, sex = 'F', turns = [], phase = 'idle', busy = false, ctl = null, t0 = 0, timerId = 0, speakOn = true, voices = [];

function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function scroll(){ log.scrollTop = log.scrollHeight; }
function addMsg(kind, who, text){
  const m = el('div', 'msg ' + kind);
  if (who) m.append(el('span', 'who', who));
  const body = el('span', 'body', text); m.append(body);
  if ((kind === 'patient') && 'speechSynthesis' in window){
    const b = el('button', 'replay', '再生'); b.type = 'button'; b.onclick = () => say(body.textContent, true); m.append(b);
  }
  log.append(m); scroll(); return body;
}
function setErr(t){ $('err').textContent = t || ''; }
const ERR = { not_granted:'Claude の使用が許可されていません。ページを開き直して許可してください。', sampling_disabled:'このアカウントでは Claude を使用できません。', rate_limited:'利用上限に達したか、混み合っています。しばらく待ってからもう一度送信してください。', session_expired:'もう一度 Claude にログインしてください。', refused:'この内容には応答できませんでした。言い方を変えて送ってください。' };
function errText(e){ return ERR[e && e.code] || '通信に失敗しました。もう一度送信してください。'; }

/* ---------- speech ---------- */
const FEMALE = /\b(aria|jenny|ava|emma|michelle|ana|sara|nancy|jane|libby|sonia|samantha|zoe|allison|susan|karen|moira|tessa|serena|victoria|nicky|joelle|google us english|female)\b/i;
const MALE = /\b(guy|david|mark|andrew|brian|christopher|eric|roger|steffan|davis|jason|tony|ryan|thomas|evan|tom|aaron|nathan|alex|daniel|fred|arthur|reed|male)\b/i;
function quality(v){
  let q = 0; const n = v.name;
  if (/natural|neural|online/i.test(n)) q += 100;          // Edge neural voices
  if (/premium|enhanced|siri/i.test(n)) q += 80;            // Apple downloaded voices
  if (/google/i.test(n)) q += 60;                           // Chrome / Android
  if (/compact|espeak|zira|david|mark|hazel|fred|albert|bad news|bahh|bells|boing|bubbles|cellos|whisper|zarvox|trinoids|junior|ralph|kathy|princess|organ|superstar|jester|wobble|good news/i.test(n)) q -= 80;
  if (/en(-|_)us/i.test(v.lang)) q += 10;
  if (!v.localService) q += 5;
  return q;
}
function loadVoices(){
  try { voices = speechSynthesis.getVoices().filter(v => /^en(-|_)/i.test(v.lang)); } catch(e){ voices = []; }
  fillVoiceMenu();
}
function pickVoice(s){
  if (voiceChoice){ const v = voices.find(x => x.voiceURI === voiceChoice); if (v) return v; }
  if (!voices.length) return null;
  const us = voices.filter(v => /en(-|_)us/i.test(v.lang)); const pool = us.length ? us : voices;
  const want = s === 'M' ? MALE : FEMALE, other = s === 'M' ? FEMALE : MALE;
  const ranked = pool.slice().sort((a, b) => quality(b) - quality(a));
  const match = ranked.find(v => want.test(v.name) && !other.test(v.name));
  return match || ranked[0];
}
let voiceChoice = '';
try { voiceChoice = localStorage.getItem('sp_voice') || ''; } catch(e){}
function fillVoiceMenu(){
  const sel = $('voicepick'); if (!sel) return;
  const keep = voiceChoice; sel.innerHTML = '';
  const auto = el('option', null, '声：自動（おすすめ）'); auto.value = ''; sel.append(auto);
  voices.filter(v => /en(-|_)us/i.test(v.lang)).sort((a, b) => quality(b) - quality(a)).forEach(v => { const o = el('option', null, v.name.replace(/^Microsoft /, '') + (quality(v) >= 50 ? ' ★' : '')); o.value = v.voiceURI; sel.append(o); });
  sel.value = voices.some(v => v.voiceURI === keep) ? keep : '';
  sel.hidden = !voices.length;
}
if ('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function say(text, force){
  if (!('speechSynthesis' in window) || (!speakOn && !force)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/^Finding:.*$/gim, '').trim());
    const s = (phase === 'attending') ? 'M' : sex; const v = pickVoice(s); if (v) u.voice = v;
    u.lang = (v && v.lang) || 'en-US'; u.rate = 0.97;
    speaking = true; const done = () => { if (!speaking) return; speaking = false; box.value = ''; lastVal = ''; autosize(); refocus(); };
    u.onend = u.onerror = done; setTimeout(done, 4000 + text.length * 90);
    speechSynthesis.speak(u);
  } catch(e){ speaking = false; }
}

/* ---------- clock ---------- */
function startClock(){ t0 = Date.now(); clearInterval(timerId); timerId = setInterval(tick, 1000); tick(); }
function tick(){ const s = Math.floor((Date.now() - t0) / 1000); $('clock').textContent = String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); }

/* ---------- prompts ---------- */
function caseText(fields){
  const c = CASES[kase]; return [c.head, ...fields.map(f => c[f])].join('\n');
}
function transcript(){ return turns.map(t => t.who + ': ' + t.text).join('\n'); }
function patientPrompt(){
  const att = phase === 'attending';
  let p = `You are role-playing for Japanese 4th-year medical students practicing medical interviews in English.
${att ? M.attending : 'You are the standardized patient. ' + M.scene}

THE CASE (use the ${sex} version; ignore details for the other version):
${caseText(M.fields)}

${att ? '' : PATIENT_RULES}
`;
  if (M.diagnosis) p += `
ENDING
- When the student begins to close (asks "Is there anything else?", "Do you have any questions?", or thanks you) and you have not yet asked it, ask: "So, doctor, what do you think is wrong with me?"
- After asking it, guide the student to give (1) the main problems and (2) tests to confirm the diagnosis. If they give only a diagnosis, ask "What tests will I need to find out for sure?" If only tests, ask "And what do you think the main problem is?" If stuck, ask "Is it something serious? What are the main problems?" As a layperson, never say whether the answer is right.
- When both parts have been answered, or after three tries, say a short natural thank-you and goodbye, then write [[END]] at the very end.
`;
  p += `
TRANSCRIPT SO FAR:
${transcript()}

Write ONLY ${att ? "Dr. Smith's" : "the patient's"} next reply. No name label, no quotation marks.`;
  return p;
}
function clean(t){ return t.replace(/^\s*(Patient|Dr\.? Smith|Mr\.? \w+|Ms\.? \w+)\s*:\s*/i,'').replace(/^["“]|["”]$/g,'').replace(/\*/g,'').trim(); }

/* ---------- flow ---------- */
async function ask(prompt, opts, onText){
  if (!sample) throw { code:'not_granted' };
  ctl = new AbortController();
  return sample(prompt, Object.assign({ cache:false, signal:ctl.signal, onText: onText ? ({text}) => onText(text) : undefined }, opts));
}
function setBusy(b){ busy = b; $('send').disabled = b; $('hint').disabled = b; $('end').disabled = b; $('present').disabled = b; }

async function sendLine(){
  const text = box.value.trim(); if (!text || busy) return;
  setErr('');
  if (phase === 'task') return submitTask(text);
  if (phase !== 'talk' && phase !== 'attending') return;
  cancelAuto(); box.value = ''; lastVal = ''; autosize();
  addMsg('student', 'You', text); turns.push({ who: phase === 'attending' ? 'Student (presenting)' : 'Student', text });
  nudges = 0;
  await patientTurn(() => { turns.pop(); box.value = text; autosize(); });
}

async function patientTurn(onFail){
  clearSilence();
  setBusy(true);
  const who = phase === 'attending' ? 'Dr. Smith' : CASES[kase].names[sex];
  const body = addMsg('patient', who, '…');
  try {
    const { text: out } = await ask(patientPrompt(), { modelTier:'quick' }, t => { body.textContent = clean(t.replace('[[END]]','')); scroll(); });
    const ended = out.includes('[[END]]');
    let reply = clean(out.replace('[[END]]','')) || 'Sorry, doctor, could you say that again?';
    const fm = reply.match(/\n?\s*Finding:.*$/is);
    if (fm && mode === 's7'){ reply = reply.slice(0, fm.index).trim(); body.textContent = reply; addMsg('finding', null, fm[0].trim()); }
    else body.textContent = reply;
    turns.push({ who: phase === 'attending' ? 'Dr. Smith' : 'Patient', text: reply + (fm && mode==='s7' ? ' ' + fm[0].trim() : '') });
    say(reply);
    if (ended) finishMain(); else armSilence();
  } catch(e){
    body.parentElement.remove(); onFail && onFail(); setErr(errText(e));
  } finally { setBusy(false); if (!speaking) refocus(); }
}

/* if the student says nothing for a while, the patient speaks up (at most twice in a row) */
const SILENCE_MS = 20000; let silenceTimer = 0, nudges = 0;
function clearSilence(){ clearTimeout(silenceTimer); silenceTimer = 0; }
function armSilence(){
  clearSilence();
  if (phase !== 'talk' && phase !== 'attending') return;
  silenceTimer = setTimeout(async () => {
    if ((phase !== 'talk' && phase !== 'attending') || busy || box.value.trim() || nudges >= 2) return;
    if ('speechSynthesis' in window && speechSynthesis.speaking){ armSilence(); return; }
    nudges++;
    turns.push({ who:'Note', text:'The student has been silent for about 20 seconds.' });
    await patientTurn(() => { turns.pop(); });
  }, SILENCE_MS);
}

function finishMain(){
  clearSilence(); phase = 'done'; clearInterval(timerId);
  addMsg('system', null, '面接は終了です。');
  showAfter([['講評を受ける', async () => { await runFeedback(); showAfter([['H&Pを書いて採点を受ける', () => startTask()], ['新しい患者', () => newPatient()]]); }], ['H&Pを書いて採点を受ける', () => startTask()], ['新しい患者', () => newPatient()]]);
}
function showAfter(btns){
  const wrap = el('div', 'tools'); wrap.style.justifyContent = 'center';
  btns.forEach(([t, f]) => { const b = el('button', 'tool', t); b.type = 'button'; b.onclick = () => { wrap.remove(); f(); }; wrap.append(b); });
  log.append(wrap); scroll();
}

async function endInterview(){
  if (busy) return;
  if (M.diagnosis && phase === 'talk'){
    if (!turns.some(t => /what do you think is wrong/i.test(t.text))){
      const q = 'So, doctor, what do you think is wrong with me?';
      addMsg('patient', CASES[kase].names[sex], q); turns.push({ who:'Patient', text:q }); say(q);
      setErr(''); return;
    }
    return finishMain();
  }
  if (phase !== 'talk' && phase !== 'attending') return;
  clearInterval(timerId);
  phase = 'feedback';
  await runFeedback();
  if (M.task) startTask(); else { phase = 'done'; showAfter([['新しい患者', () => newPatient()]]); }
}

async function runFeedback(){
  setBusy(true);
  const body = addMsg('coach', 'フィードバック', '講評を作成しています…（30秒ほどかかることがあります）');
  const prompt = `You are an instructor giving feedback to a Japanese 4th-year medical student after a practice medical interview in English (${M.title}). Focus of this practice: ${M.focus || 'the whole interview'}.

THE CASE (${sex} version):
${caseText(['open','hpi','hx','fhsh','ros','pe','tests'])}

TRANSCRIPT:
${transcript()}

WHAT TO COVER:
${M.feedback}

FORMAT: ${FB_STYLE}`;
  try { const { text } = await ask(prompt, { modelTier:'default' }, t => { body.textContent = t; scroll(); }); body.textContent = text; }
  catch(e){ body.textContent = errText(e); }
  finally { setBusy(false); }
}

let taskStart = 0;
function startTask(){
  clearSilence(); phase = 'task';
  addMsg('system', null, M.task.ask);
  box.placeholder = 'ここに英語で入力して「送信」';
  $('hint').hidden = true; $('end').hidden = true; $('present').hidden = true; $('auto').hidden = true; $('autobar').hidden = true; cancelAuto();
  if (M.task.timer){ startClock(); }
  box.focus();
}
async function submitTask(text){
  box.value = ''; autosize();
  addMsg('student', 'あなたの記載', text);
  setBusy(true);
  const body = addMsg('coach', '添削', '添削しています…（30秒ほどかかることがあります）');
  clearInterval(timerId);
  const prompt = `You are an instructor correcting a Japanese 4th-year medical student's English writing after a practice interview (${M.title}).

THE CASE (${sex} version):
${caseText(['open','hpi','hx','fhsh','ros','pe','tests'])}

INTERVIEW TRANSCRIPT:
${transcript()}

STUDENT'S WRITING:
${text}

TASK:
${M.task.check}
Judge content only against what was actually obtained in the transcript; also list case facts the student never asked about.

FORMAT: Write the comments in Japanese, plain text only, no Markdown symbols (#, *, |) and no tables. Put any corrected English version under the heading 【修正例】. Do not grade whether the diagnosis is correct.`;
  try { const { text: out } = await ask(prompt, { modelTier:'default' }, t => { body.textContent = t; scroll(); }); body.textContent = out; }
  catch(e){ body.textContent = errText(e); }
  finally { setBusy(false); phase = 'done'; showAfter([['新しい患者', () => newPatient()]]); }
}

async function hint(){
  if (busy || M.noHint || (phase !== 'talk' && phase !== 'attending')) return;
  setBusy(true);
  const body = addMsg('coach', 'ヒント', '…');
  const prompt = `A Japanese medical student is practicing an English medical interview (${M.title}). Focus: ${M.focus}.
TRANSCRIPT:
${transcript() || '(nothing yet)'}

In Japanese, give ONE short hint (1-2 sentences) about what the student should ask or do next, with one example sentence in English. Plain text only. Do not reveal the diagnosis or any answer the patient has not given.`;
  try { const { text } = await ask(prompt, { modelTier:'quick' }, t => { body.textContent = t; scroll(); }); body.textContent = text.replace(/\*/g,''); }
  catch(e){ body.textContent = errText(e); }
  finally { setBusy(false); }
}

function toAttending(){
  if (busy || phase !== 'talk') return;
  phase = 'attending'; $('present').hidden = true;
  turns.push({ who:'Note', text:'The examination is over. The student now presents the patient to Dr. Smith.' });
  addMsg('system', null, '指導医 Dr. Smith に替わりました。“Dr. Smith, may I present my patient?” から始めてください。');
}

function pickCase(pref){
  const keys = Object.keys(CASES); let last = '';
  try { last = localStorage.getItem('sp_last') || ''; } catch(e){}
  const opts = [];
  keys.forEach(k => ['M','F'].forEach(s => { if (k + s !== last && (!pref || pref === s)) opts.push([k, s]); }));
  const r = new Uint32Array(1); crypto.getRandomValues(r);
  const [k, s] = opts[r[0] % opts.length];
  try { localStorage.setItem('sp_last', k + s); } catch(e){}
  kase = k; sex = s;
}

function begin(){
  pickCase(); turns = []; log.innerHTML = '';
  phase = 'talk';
  $('footer').hidden = false; $('hint').hidden = !!M.noHint; $('end').hidden = false; $('end').textContent = M.endLabel || '面接を終える';
  $('present').hidden = !M.presenting; box.placeholder = '英語で話しかける（キーボードのマイクで音声入力できます）';
  if (mode === 's7'){
    const c = CASES[kase];
    addMsg('system', null, `患者：${c.names[sex]}　${c.brief.replace('Story in brief: ','')}`);
  }
  addMsg('system', null, mode === 's7' ? '医師として英語で自己紹介をし、診察の許可を得てから始めてください。' : '医師として英語で自己紹介をして、面接を始めてください。');
  $('autobar').hidden = !autoOn; $('auto').hidden = false; nudges = 0;
  startClock(); box.focus(); armSilence();
}
function newPatient(){ speechSynthesis && speechSynthesis.cancel && speechSynthesis.cancel(); ctl && ctl.abort(); setBusy(false); setErr(''); begin(); }

function renderIntro(){
  log.innerHTML = ''; $('footer').hidden = true;
  const mobile = window.matchMedia('(pointer:coarse)').matches;

  const app = el('section', 'intro recommend');

  page.append(how);
  page.append(el('p', 'tip', '最初の送信時に、このページが Claude を使うことの許可を求められます。応答はあなた自身の Claude アカウントの利用枠を使います。'));
  const b = el('button', 'primary', '開始する'); b.type = 'button'; b.id = 'start'; b.onclick = () => begin();

  if (!sample){ const n = el('p', 'err', 'Claude に接続しています…'); n.id = 'conn'; page.append(n); }
  if (!window.claude){
    const pc = el('section', 'intro');

function patientAge(){ const m = CASES[kase].head.match(new RegExp(sex + ' = [^,]+, (\\d+)')); return m ? m[1] : ''; }

function b64(str){ return btoa(unescape(encodeURIComponent(str))); }
function voicePrompt(){
  const blockOf = k => { const c = CASES[k]; return [c.head, ...M.fields.map(f => c[f])].join('\n') + (M.feedback || M.task ? '\n' + ['open','hpi','hx','fhsh','ros','pe','tests'].filter(f => !M.fields.includes(f)).map(f => c[f]).join('\n') : ''); };
  const rest = Object.keys(CASES).filter(k => k !== kase);
  for (let i = rest.length - 1; i > 0; i--){ const r = new Uint32Array(1); crypto.getRandomValues(r); const j = r[0] % (i + 1); [rest[i], rest[j]] = [rest[j], rest[i]]; }
  const order = [kase, ...rest];
  const caseTags = order.map((k, i) => `<case n="${i + 1}">${b64(blockOf(k))}</case>`).join('\n');
  const role = M.attending
    ? `PART 1: You are the patient being examined. ${M.scene} PART 2: when the student says "Dr. Smith, may I present my patient?", switch role: ${M.attending}`

  let p = `[Practice setup for a medical English class. Please follow these instructions exactly for the rest of this chat.]

I am a Japanese 4th-year medical student practicing a medical interview in English (${M.title}). After this message I will switch to voice conversation mode and talk to you.

YOUR FIRST REPLY: reply with exactly this Japanese sentence and nothing else (it is an instruction for me, not part of the role-play): 「音声モード（入力欄の右の音波のマーク）を起動して、医師として英語で自己紹介をしてください。」
After that, stay silent until I speak. When I introduce myself in voice mode, answer in role as the patient and let me lead the interview.

YOUR ROLE
${role}

THE CASES
There are ${order.length} cases below, encoded in Base64 so that I cannot read them in advance. Start with case 1. Decode only the current case, silently, and follow it exactly. Always use the ${sex === 'M' ? 'M (male)' : 'F (female)'} version and ignore details for the other version. Never read a case aloud, never quote it, and never name the diagnosis while in role.
${caseTags}

${PATIENT_RULES}
- This is a spoken conversation: keep every reply short and natural, as a real patient would speak.
`;
  if (M.diagnosis) p += `
ENDING
- When I begin to close (I ask "Is there anything else?", "Do you have any questions?", or thank you) and you have not yet asked it, ask: "So, doctor, what do you think is wrong with me?"
- Then guide me to give (1) the main problems and (2) tests to confirm the diagnosis. If I give only a diagnosis, ask "What tests will I need to find out for sure?" If only tests, ask "And what do you think the main problem is?" As a layperson, never say whether my answer is right.
- When both parts are answered, or after three tries, thank me and say goodbye naturally.
`;
  p += M.noHint
    ? `\nThis is a mock exam: give no hints, even if I ask.\n`
    : `\nHINT: if I say "Time out", step out of role, give ONE short hint in simple English about what to ask next, then return to role.\n`;
  p += `
AFTER THE INTERVIEW
When I say or type "End of interview" or "End of encounter" (or 「フィードバック」), step out of role and give feedback in writing.
${M.feedback ? 'What to cover: ' + M.feedback + '\n' : ''}${M.task ? (M.diagnosis ? `Then ask me in Japanese whether I want to write an H&P for grading: 「H&Pを書いて採点を受ける場合は、H&Pを英語で入力してください（目安15分。PE と Labs は “Not performed” と書いてください）。」 If I send one, evaluate it: ${M.task.check}` : `Then ask me in Japanese: 「${M.task.ask}」 When I send it: ${M.task.check}`) + ' Judge content against what I actually obtained in the interview.\n' : ''}Format: ${FB_STYLE} Put any corrected English version under the heading 【修正例】.
At the very end of the feedback add this line: 「別の患者で練習するときは “New patient” と言うか入力してください。」

NEW PATIENT
When I say or type "New patient" (at any time), drop the current patient completely and move to the next case (case 2, then 3, and so on; after the last case go back to case 1). Reply only with this Japanese sentence: 「新しい患者を用意しました。医師として英語で自己紹介をしてください。」 Then stay silent until I speak, and play the new patient with all the rules above, including the ending and the feedback. Never reuse details from an earlier patient.`;
  return p;
}
function copyNow(text, status, okMsg){
  let p; try { p = navigator.clipboard.writeText(text); } catch(e){ p = Promise.reject(e); }
  p.then(() => { status.textContent = okMsg; }).catch(() => {
    const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.append(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch(e){} ta.remove();
    status.textContent = ok ? okMsg : '自動でコピーできませんでした。「うまくコピーできない場合」を開いて、文章をコピーしてください。';
  });
}
